name: Build Reel production pack

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Reel concept (for example: Rainy night cafe)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate production pack
        env:
          TOPIC: ${{ inputs.topic }}
        run: npm run production-pack -- "$TOPIC"
      - name: Upload production pack
        uses: actions/upload-artifact@v4
        with:
          name: reel-production-pack
          path: |
            projects/
            assets/rainy-night/
          if-no-files-found: error
          retention-days: 14
