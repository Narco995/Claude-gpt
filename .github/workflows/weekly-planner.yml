name: Weekly Reel planner

on:
  workflow_dispatch:
  schedule:
    # 08:00 UAE time (Asia/Dubai, UTC+4) every Monday
    - cron: "0 4 * * 1"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate this week's plan
        env:
          TZ: Asia/Dubai
        run: npm run weekly-plan
      - name: Commit weekly plan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weekly-plans/
          if git diff --cached --quiet; then
            echo "No weekly plan changes to commit."
          else
            git commit -m "chore: generate weekly Reel plan"
            git push
          fi
